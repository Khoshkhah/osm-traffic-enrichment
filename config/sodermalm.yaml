name: "sodermalm"
pbf_path: "/home/kaveh/projects/sodermalm/map/sodermalm.osm.pbf"
output_path: "/home/kaveh/projects/sodermalm/map"
# → Creates: /home/kaveh/projects/sodermalm/map/sodermalm.duckdb

# Boundary filter (optional, but good to use since we have it)
boundary_path: "/home/kaveh/projects/sodermalm/boundary/sodermalm.geojson"

options:
  # Build routing graph table
  build_graph: true
  
  # Add H3 spatial indexing
  h3_indexing: true
  h3_resolution: 15
  
  # Graph simplification (experimental)
  # Contracts degree-2 nodes into single edges
  simplify: yes
  
  # Speed processing
  process_speeds: true
  
  # Extract turn restrictions
  extract_restrictions: true
  
  # Calculate travel costs
  calculate_costs: true

modes:
  - driving
  - walking
  - cycling
