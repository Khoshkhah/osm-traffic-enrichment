# Network config for Södermalm, Stockholm
# Usage: python pipeline_network.py --config config/sodermalm.yaml

name: sodermalm
boundary_path: boundaries/sodermalm.geojson
country_pbf: map/sweden-latest.osm.pbf
refresh: false

h3_resolutions:
  - 6
  - 7
  - 8

output_path: db

options:
  build_graph: true
  h3_indexing: true
  simplify: true
  process_speeds: true
  extract_restrictions: true
  calculate_costs: true

modes:
  - driving
  - walking
  - cycling
