# Traffic pipeline config template
# Copy to config/{name}_traffic.yaml and fill in the values.
#
# Usage:
#   python pipeline_traffic.py --config config/myarea_traffic.yaml
#   python pipeline_traffic.py --config config/myarea_traffic.yaml --source mapbox
#
# The boundary polygon is read from the DuckDB boundary table — no boundary_path needed.
# Required API keys go in .env (not here):
#   MAPBOX_ACCESS_TOKEN, GOOGLE_MAPS_API_KEY, TOMTOM_API_KEY
#
# Supported keys (CLI equivalent):
#   name           (--name)          area name for logs and tile cache dirs
#   db_path        (--db)            path to DuckDB built by pipeline_network.py
#   traffic_sources                  list of sources to run  (--source all)
#   mapbox_zoom    (--mapbox-zoom)   Mapbox MVT tile zoom
#   google_zoom    (--google-zoom)   Google Maps screenshot zoom
#   tomtom_zoom    (--tomtom-zoom)   TomTom PBF tile zoom
#   refresh        (--refresh)       true = delete cached tile files before running
#   matcher        (--matcher)       Mapbox/TomTom map-matching backend: route | geometric
#   match_step_m                     graph-DTW sampling step (m); smaller = denser/slower
#   utm_srid                         projected metre SRID for matching (default: auto UTM)
#   min_edge_used_pct                per-area override of Filter 2 (% of OSM edge the winner must use)
#   segment_match                    per-area override block of Filter 1 (resolve_routes) thresholds
#
# Per-provider Filter 1/2 thresholds live in config/match_thresholds.yaml
# (generated by scripts/calibrate_thresholds.py). The keys above only override them.

name: myarea
db_path: db/myarea.duckdb
refresh: false

traffic_sources:
  - mapbox
  - google
  - tomtom

mapbox_zoom: 14    # 14 ≈ 9.5 m/tile — good for city scale
google_zoom: 16    # 16 ≈ 2.4 m/px  — auto-reduced if screenshot too large
tomtom_zoom: 14

# Map-matching (Mapbox/TomTom; Google is always pixel-based).
# The route matcher does NO filtering: each OSM edge takes its max-covering candidate, and the
# winner's covering_match (% of edge) + quality_match (alignment 0–1) are stored in the
# *_congestion_history tables so matches can be filtered later via SQL.
matcher: route            # route = network_matching graph-DTW; geometric = legacy corridor
match_step_m: 10.0        # graph-DTW sampling step (m)
match_tau: 15.0           # drift scale (m) in the stored quality_match score
# utm_srid: 3006          # optional; auto-derived from the boundary (UTM) if omitted
