# Network config for Tartu, Estonia
# Usage: python pipeline_network.py --config config/tartu.yaml

name: tartu
boundary_path: boundaries/tartu.geojson
country_url: https://download.geofabrik.de/europe/estonia-latest.osm.pbf
refresh: false

h3_resolutions:
  - 6
  - 7
  - 8

output_path: db

options:
  build_graph: true
  h3_indexing: true
  simplify: true
  process_speeds: true
  extract_restrictions: true
  calculate_costs: true

modes:
  - driving
  - walking
  - cycling
