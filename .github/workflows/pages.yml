name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}sensor_selector_cloud.html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject MotherDuck token
        env:
          MD_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          python3 -c "
          import os, pathlib
          p = pathlib.Path('docs/sensor_selector_cloud.html')
          p.write_text(p.read_text().replace('%%MOTHERDUCK_TOKEN%%', os.environ['MD_TOKEN']))
          "

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
